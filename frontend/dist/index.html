      /* Round 107 — boot-fallback minimal.
         Objectif : pas de « page » parasite à l'ouverture. Juste un fond

        margin: 0;
        padding: 0;
        background: #0b0f17;
        color: #e2e8f0;

         mobile et la scroll-bar horizontale apparaissait. */

      body { overflow-x: hidden; overscroll-behavior-y: contain; }
      #boot-fallback {

        <h2>⚠ Zentara runtime error</h2>
        <pre id="boot-error-detail"></pre>
      </div>
    </div>
    <!-- Round 107 — le « boot-pending-flag » (toast violet/bleu qui

         erreurs s'affichent dans #boot-error. React, quand il monte
         avec succès, retire le fallback via #boot-fallback.classList.add('hide'). -->
    <!-- Boot-guard : fichier externe (CSP-compliant, pas de inline). Le
